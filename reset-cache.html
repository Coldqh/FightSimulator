<!doctype html><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><meta http-equiv=Cache-Control content=no-store><title>Fight World reset 2.3.8</title><body style='background:#08090b;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh'><main style='max-width:720px;border:1px solid #333;border-radius:20px;padding:22px;background:#11151c'><h1>Fight World reset 2.3.8</h1><pre id=log>start</pre><a style='color:white;background:#cf2525;padding:10px 14px;border-radius:10px;text-decoration:none' href='index.html?cacheReset=2.3.8'>Открыть игру</a></main><script>const l=document.getElementById('log');function log(x){l.textContent+='\n'+x}async function r(){if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();log('SW '+regs.length);for(const x of regs){await x.unregister();log('unregister '+x.scope)}}if('caches'in window){const keys=await caches.keys();log('caches '+keys.length);for(const k of keys){const low=k.toLowerCase();if(low.includes('fight')||low.includes('simulator')||low.startsWith('fw-')){await caches.delete(k);log('delete '+k)}}}setTimeout(()=>location.replace('index.html?cacheReset=2.3.8&t='+Date.now()),500)}r().catch(e=>log('ERR '+e.message))</script></body>
