<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Fight World reset 2.3.9</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#08090b; color:#fff; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .card { width:min(720px,calc(100vw - 28px)); border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:22px; background:#11151c; box-shadow:0 24px 80px rgba(0,0,0,.45); }
    pre { white-space:pre-wrap; background:#050609; padding:12px; border-radius:12px; color:#ddd; max-height:320px; overflow:auto; }
    a,button { display:inline-flex; align-items:center; justify-content:center; background:#cf2525; color:white; border:0; border-radius:10px; padding:10px 14px; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Fight World reset 2.3.9</h1>
    <p>Чищу старый кэш и открываю финальную сборку 2.3.9. Сохранение карьеры не трогаю.</p>
    <pre id="log">start</pre>
    <a id="go" href="index.html?cacheReset=2.3.9">Открыть игру</a>
  </main>
  <script>
    "use strict";
    const logNode = document.getElementById("log");
    function log(text) { logNode.textContent += "\n" + text; }
    async function reset() {
      document.getElementById("go").href = "index.html?cacheReset=2.3.9&t=" + Date.now();

      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        log("Service workers: " + regs.length);
        for (const reg of regs) {
          log("unregister " + reg.scope);
          await reg.unregister();
        }
      }

      if ("caches" in window) {
        const keys = await caches.keys();
        log("Cache entries: " + keys.length);
        for (const key of keys) {
          const low = key.toLowerCase();
          if (low.includes("fight") || low.includes("simulator") || low.startsWith("fw-")) {
            log("delete " + key);
            await caches.delete(key);
          }
        }
      }

      try {
        localStorage.setItem("fightWorldUpdateTarget", "gameplay-update-fix-2.3.9");
        sessionStorage.setItem("fightWorldUpdateTarget", "gameplay-update-fix-2.3.9");
      } catch (error) {}

      log("done -> open 2.3.9");
      setTimeout(() => location.replace("index.html?cacheReset=2.3.9&t=" + Date.now()), 500);
    }
    reset().catch((error) => log("ERR " + (error && error.message ? error.message : error)));
  </script>
</body>
</html>
